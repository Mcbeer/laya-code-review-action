[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-review"
version = "0.1.0"
description = "Deterministic, ruleset-driven PR review using the Laya System One decision model"
requires-python = ">=3.10"
dependencies = [
    "laya==0.3.20",
    "huggingface_hub>=0.20",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
laya-review = "laya_review.cli:main"

[tool.setuptools.packages.find]
include = ["laya_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
